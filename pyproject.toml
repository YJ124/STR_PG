[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "str-pg"
version = "2.0.0"
description = "Pointer-graph short tandem repeat genotyping with SW-default allele likelihoods"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "Jiajing Yuan"},
  {name = "Zhengfa Xue"},
  {name = "Jiayin Wang"}
]
keywords = ["bioinformatics", "genotyping", "pangenome", "STR", "tandem repeat"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
bio = ["pysam>=0.22"]
test = ["pytest>=7"]
dev = ["build>=1", "pytest>=7"]

[project.scripts]
strpg = "strpg.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "xiaorong/tests"]
